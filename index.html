    <!-- Default document title + OG metadata. IMPORTANT: this is a client-rendered
         SPA served from a single index.html for every route, so per-page
         usePageMetadata() overrides only reach clients that execute JavaScript
         (browsers, LinkedIn Post Inspector, in-app browser previews).
         Crawlers that do NOT execute JS — WhatsApp, Slack, Telegram, iMessage —
         will always see the defaults below no matter which URL is shared.
         Per-URL OG requires SSR / prerendering at the hosting layer; that is
         a platform limitation, not something the app code can fix.
         The defaults are therefore written to be brand-safe and never
         misleading on any URL. -->
    <title>Consolve Management Solutions</title>
    <meta
      name="description"
      content="Consolve — استشارات إدارية عملية للشركات والمؤسسات في المملكة العربية السعودية."
